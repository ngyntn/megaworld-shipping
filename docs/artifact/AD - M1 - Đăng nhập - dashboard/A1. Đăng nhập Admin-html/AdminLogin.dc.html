<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập quản trị</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF4FB}
*{box-sizing:border-box}
a{color:#1E5FC2;text-decoration:none}a:hover{color:#0B3A75;text-decoration:underline}
.in{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid #CFDBEA;border-radius:8px;background:#fff}
.in input{flex:1;border:0;font:inherit;font-size:14.5px;outline:none;color:#0F1E36;background:transparent;min-width:0}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #0F1E36; background: #EEF4FB; min-height: 100vh; display: flex; flex-wrap: wrap">
  <section style="flex: 1 1 520px; min-width: 0; background: #0A2B5C; color: #fff; padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; gap: 28px; position: relative; overflow: hidden">
    <svg aria-hidden="true" width="620" height="300" viewBox="0 0 620 300" fill="none" stroke="#1D4E91" stroke-width="2" style="position: absolute; right: -40px; bottom: 40px">
      <path d="M40 190h520l-60 70H110z"></path><path d="M120 190v-60h360v60"></path><path d="M150 130v-40h90v40M250 130v-40h90v40M350 130v-40h90v40"></path><path d="M150 110h90M250 110h90M350 110h90"></path><path d="M420 90V50h40v40"></path>
      <path d="M0 285c30 0 30-10 60-10s30 10 60 10 30-10 60-10 30 10 60 10 30-10 60-10 30 10 60 10 30-10 60-10 30 10 60 10 30-10 60-10 30 10 60 10"></path>
    </svg>
    <div style="display: flex; align-items: center; gap: 12px; position: relative">
      <svg width="46" height="34" viewBox="0 0 46 34" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h38l-5 8H9z"></path><path d="M10 22v-7h26v7"></path><path d="M15 15V9h8v6M25 15v-4h7v4"></path></svg>
      <span style="font-size: 20px; font-weight: 700">SeaLogistics</span>
    </div>
    <div style="position: relative; max-width: 560px">
      <h1 style="margin: 0; font-size: 44px; line-height: 1.15; font-weight: 700">Hệ thống quản lý giá cước vận tải biển</h1>
      <p style="margin: 16px 0 0; font-size: 18px; color: #C6D5EB">Cập nhật giá nhanh. Không nhầm giá cũ. Khách tự tra cứu.</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 36px; position: relative">
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #DDE7F5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l9 9-8 8zM7.5 7.5h.01"></path></svg>Giá cước
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #DDE7F5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>Lịch tàu
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #DDE7F5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12zM12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg>Cảng biển
      </div>
    </div>
  </section>

  <section style="flex: 1 1 420px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 40px 20px">
    <form style="width: 100%; max-width: 400px; background: #fff; border: 1px solid #DCE6F2; border-radius: 14px; padding: 36px 32px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 6px">
        <svg width="54" height="40" viewBox="0 0 46 34" fill="none" stroke="#0B3A75" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 22h38l-5 8H9z"></path><path d="M10 22v-7h26v7"></path><path d="M15 15V9h8v6M25 15v-4h7v4"></path></svg>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; color: #0A2B5C">Chào mừng trở lại</h2>
        <p style="margin: 0; font-size: 14px; color: #5B6B82">Đăng nhập dành cho nhân viên báo giá</p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #33445E">Email hoặc tên đăng nhập
        <span class="in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>
          <input type="text" placeholder="nhanvien@congty.vn" autocomplete="username">
        </span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #33445E">Mật khẩu
        <span class="in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input type="{{pwType}}" value="password" autocomplete="current-password">
          <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 600; color: #1E5FC2; cursor: pointer; min-height: 40px">{{pwText}}</button>
        </span>
      </label>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
        <label style="display: flex; align-items: center; gap: 8px; color: #33445E; min-height: 40px"><input type="checkbox" style="width: 18px; height: 18px"> Ghi nhớ đăng nhập</label>
        <a href="AdminLogin.dc.html">Quên mật khẩu?</a>
      </div>
      <a href="AdminDashboard.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 8px; background: #0B3A75; color: #fff; font-size: 15px; font-weight: 700; text-decoration: none">Đăng nhập</a>
      <p style="margin: 4px 0 0; font-size: 13px; color: #5B6B82; text-align: center">Chưa có tài khoản? Liên hệ quản trị viên</p>
      <a href="Main.dc.html" style="font-size: 13px; text-align: center">← Về trang tra giá cho khách</a>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { show: false }; }
  renderVals() {
    var self = this, s = this.state.show;
    return { pwType: s ? 'text' : 'password', pwText: s ? 'Ẩn' : 'Hiện', pwLabel: s ? 'Ẩn mật khẩu' : 'Hiện mật khẩu', togglePw: function () { self.setState({ show: !s }); } };
  }
}
</script>
</body>
</html>
