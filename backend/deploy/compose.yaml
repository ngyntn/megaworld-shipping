name: megaworld-shipping
services:
  pocketbase:
    image: megaworld-pocketbase:0.40.6
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PB_ENV: production
      PB_PUBLIC_URL: https://${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
      PB_ORIGINS: ${PB_ORIGINS:?Set PB_ORIGINS}
    secrets:
      - pb_encryption_key
    volumes:
      - pb_data:/data
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pb_data:
  caddy_data:
  caddy_config:
secrets:
  pb_encryption_key:
    file: ./secrets/pb_encryption_key
